services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: archly
      POSTGRES_PASSWORD: archly_dev_password
      POSTGRES_DB: archly
    ports:
      - "5433:5432"
    volumes:
      - archly-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archly -d archly"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  archly-postgres-data:
